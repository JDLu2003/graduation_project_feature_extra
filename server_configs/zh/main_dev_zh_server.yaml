paths:
  split_name: "dev"
  dev_txt: "/data16T_1/sunshengzhe/lujiading/data_zh/dev/dev.txt"
  video_dir: "/data16T_1/sunshengzhe/lujiading/data_zh/dev/Video_dev"
  feat_out: "../../artifacts_zh/features/dev/Video_dev_face_scene_fr"

extractor:
  active_type: "face_scene_fr"

visual_clip_config:
  model_name: "ViT-B/32"
  device: "auto"
  clip_output_dim: 512
  target_dim: 1024
  frame_sampling:
    strategy: "uniform"
    num_frames: 8
    aggregation: "mean"

face_scene_fr_config:
  device: "auto"
  face_checkpoint: "../../face_name_id/artifacts_zh/train_speaker_model/facenet_fr/outputs/checkpoints/best.pt"
  clip_model_name: "ViT-B/32"
  frame_sampling:
    strategy: "uniform"
    num_frames: 8
    aggregation: "mean"
  person_num_frames: 3
  mtcnn_image_size: 160
  mtcnn_margin: 12
  mtcnn_min_face_size: 24
  mtcnn_thresholds: [0.6, 0.7, 0.7]
  mtcnn_keep_all: true
  face_batch_size: 64
  min_detection_confidence: 0.95
  classification_strategy: "top1"
  min_classification_confidence: 0.5
  unknown_person_strategy: "other_mean"
  other_label_name: "other"

non_speaker:
  strategy: "context_video"
  fallback: "zero"

pipeline:
  skip_existing: false
  show_progress: true
